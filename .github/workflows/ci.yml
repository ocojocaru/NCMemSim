name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  push:
    branches: ["main", "dev/v1.3-model-variability", "dev/v1.4-temperature-properties"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate v1.4 thermal candidate contracts
        run: |
          python scripts/validate_api_contract.py
          python scripts/validate_v1_4_api_review.py
      - name: Compile package
        run: python -m compileall -q ncmemsim
      - name: Run test suite
        run: python -m pytest -q

  distributions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build tools
        run: python -m pip install build
      - name: Validate installed wheel and source distribution
        run: python scripts/validate_dtco_distribution.py
