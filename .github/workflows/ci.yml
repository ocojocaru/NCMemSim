name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  push:
    branches: ["main", "dev/v1.3-model-variability", "dev/v1.4-temperature-properties", "dev/v1.5-broadband-optics", "dev/v1.6-strain-confinement", "dev/v1.7-independent-calibration", "dev/v1.8-multilevel-neuromorphic", "dev/phase-r-performance-interop"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate published contracts and v1.9 preparation
        run: |
          python scripts/validate_api_contract.py
          python scripts/validate_v1_6_api_review.py --retained
          python scripts/validate_structural_parameters.py
          python scripts/validate_independent_data_review.py
          python scripts/validate_v1_7_api_review.py --retained
          python scripts/validate_v1_7_release_identity.py --retained
          python scripts/validate_v1_8_api_review.py
          python scripts/validate_v1_8_release_identity.py
          python scripts/validate_v1_9_api_review.py
      - name: Compile package
        run: python -m compileall -q ncmemsim
      - name: Run test suite
        run: python -m pytest -q

  performance-baseline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and reference dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run bounded serial baseline (no timing threshold)
        run: python scripts/run_performance_baseline.py --output "${{ runner.temp }}/performance-results" --max-trial-seconds 150 --max-total-seconds 1200
      - name: Run separate native-memory observations
        run: python scripts/run_performance_baseline.py --output "${{ runner.temp }}/performance-memory" --native-memory --skip-refinement --case trajectory-3fg --case strict-restore --max-trial-seconds 150 --max-total-seconds 1200
      - name: Retain complete baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-baseline-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/performance-results/
            ${{ runner.temp }}/performance-memory/
          retention-days: 14

  report-restoration-comparison:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical R3 experiment; current-package gates run in the other jobs.
          ref: 8c63a0a07a4eebd6273df75cc81da2711c87b765
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and comparison dependencies
        run: python -m pip install -e ".[dev]"
      - name: Recheck frozen accepted R3 against committed R2 baseline
        run: python scripts/compare_report_restoration.py --baseline-commit 6034231ffe34c374c42a43f9ac89a1a4acd7316c --output "${{ runner.temp }}/report-comparison"
      - name: Retain all paired observations, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-comparison-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/report-comparison/
            !${{ runner.temp }}/report-comparison/baseline-source/
            !${{ runner.temp }}/report-comparison/baseline.tar
          retention-days: 14

  distributions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build tools
        run: python -m pip install build
      - name: Validate installed wheel and source distribution
        run: python scripts/validate_dtco_distribution.py
