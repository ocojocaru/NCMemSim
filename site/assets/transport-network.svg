<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 650" role="img" aria-labelledby="title desc">
<title id="title">Inter-floating-gate transport network</title><desc id="desc">Nearest-neighbour tunnel links, local fields and conservative charge transfer between three floating gates.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1976D2"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto"><path d="M9,0 L9,6 L0,3 z" fill="#00897B"/></marker></defs>
<rect width="1350" height="650" rx="24" fill="#F5F9FC"/><text x="675" y="58" text-anchor="middle" font-family="Inter,Arial" font-size="34" font-weight="750" fill="#0B1F33">Inter-floating-gate transport model</text>
<g font-family="Inter,Arial" text-anchor="middle">
<g transform="translate(90 155)"><rect width="280" height="250" rx="22" fill="white" stroke="#1976D2" stroke-width="4"/><text x="140" y="48" font-size="27" font-weight="700" fill="#0B1F33">FG1</text><text x="140" y="82" font-size="18" fill="#61758A">state P₀, P₁, P₂</text><g fill="#F59E0B"><circle cx="85" cy="145" r="25"/><circle cx="140" cy="145" r="25"/><circle cx="195" cy="145" r="25"/></g><text x="140" y="207" font-size="17" fill="#61758A">local E₁, V₁</text></g>
<g transform="translate(535 155)"><rect width="280" height="250" rx="22" fill="white" stroke="#00897B" stroke-width="4"/><text x="140" y="48" font-size="27" font-weight="700" fill="#0B1F33">FG2</text><text x="140" y="82" font-size="18" fill="#61758A">state P₀, P₁, P₂</text><g fill="#F59E0B"><circle cx="85" cy="145" r="25"/><circle cx="140" cy="145" r="25"/><circle cx="195" cy="145" r="25"/></g><text x="140" y="207" font-size="17" fill="#61758A">local E₂, V₂</text></g>
<g transform="translate(980 155)"><rect width="280" height="250" rx="22" fill="white" stroke="#7C3AED" stroke-width="4"/><text x="140" y="48" font-size="27" font-weight="700" fill="#0B1F33">FG3</text><text x="140" y="82" font-size="18" fill="#61758A">state P₀, P₁, P₂</text><g fill="#F59E0B"><circle cx="85" cy="145" r="25"/><circle cx="140" cy="145" r="25"/><circle cx="195" cy="145" r="25"/></g><text x="140" y="207" font-size="17" fill="#61758A">local E₃, V₃</text></g>
<text x="452" y="240" font-size="18" font-weight="700" fill="#0B1F33">WKB link 1↔2</text><text x="897" y="240" font-size="18" font-weight="700" fill="#0B1F33">WKB link 2↔3</text>
</g>
<g fill="none" stroke-width="5"><path d="M375 290 H525" stroke="#1976D2" marker-end="url(#arr)"/><path d="M525 330 H375" stroke="#00897B" marker-end="url(#arr2)"/><path d="M820 290 H970" stroke="#1976D2" marker-end="url(#arr)"/><path d="M970 330 H820" stroke="#00897B" marker-end="url(#arr2)"/></g>
<rect x="240" y="495" width="870" height="90" rx="18" fill="#0B1F33"/><text x="675" y="535" text-anchor="middle" font-family="Inter,Arial" font-size="22" font-weight="700" fill="white">Conservative transfer step</text><text x="675" y="568" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#D7E8F5">net flux by FG = incoming flux − outgoing flux; internal redistribution preserves total charge</text>
</svg>