<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1350 680"
     role="img"
     aria-labelledby="title desc">

  <title id="title">NCMemSim inter-floating-gate transport model</title>

  <desc id="desc">
    Illustrative three-floating-gate nearest-neighbour transport network
    with bidirectional WKB tunnelling links, local electrostatic quantities
    and charge-conserving internal redistribution.
  </desc>

  <defs>

    <marker id="arr-right"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto">
      <path d="M0,0 L0,6 L9,3 z"
            fill="#1976D2"/>
    </marker>

    <marker id="arr-left"
            markerWidth="10"
            markerHeight="10"
            refX="2"
            refY="3"
            orient="auto">
      <path d="M9,0 L9,6 L0,3 z"
            fill="#00897B"/>
    </marker>

    <filter id="shadow">
      <feDropShadow dx="0"
                    dy="5"
                    stdDeviation="6"
                    flood-opacity=".15"/>
    </filter>

  </defs>

  <rect width="1350"
        height="680"
        rx="24"
        fill="#F5F9FC"/>

  <!-- Title -->
  <text x="675"
        y="58"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="34"
        font-weight="750"
        fill="#0B1F33">
    Inter-floating-gate transport model
  </text>

  <text x="675"
        y="92"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="18"
        fill="#61758A">
    Nearest-neighbour bidirectional tunnelling and conservative charge redistribution
  </text>

  <!-- Floating gates -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif"
     text-anchor="middle"
     filter="url(#shadow)">

    <!-- FG1 -->
    <g transform="translate(90 165)">

      <rect width="280"
            height="250"
            rx="22"
            fill="white"
            stroke="#1976D2"
            stroke-width="4"/>

      <text x="140"
            y="48"
            font-size="27"
            font-weight="700"
            fill="#0B1F33">
        FG1
      </text>

      <text x="140"
            y="82"
            font-size="18"
            fill="#61758A">
        state P₀ · P₁ · P₂
      </text>

      <g fill="#F59E0B">
        <circle cx="85"
                cy="145"
                r="25"/>
        <circle cx="140"
                cy="145"
                r="25"/>
        <circle cx="195"
                cy="145"
                r="25"/>
      </g>

      <text x="140"
            y="207"
            font-size="17"
            fill="#61758A">
        local E₁ · V₁
      </text>

    </g>

    <!-- FG2 -->
    <g transform="translate(535 165)">

      <rect width="280"
            height="250"
            rx="22"
            fill="white"
            stroke="#00897B"
            stroke-width="4"/>

      <text x="140"
            y="48"
            font-size="27"
            font-weight="700"
            fill="#0B1F33">
        FG2
      </text>

      <text x="140"
            y="82"
            font-size="18"
            fill="#61758A">
        state P₀ · P₁ · P₂
      </text>

      <g fill="#F59E0B">
        <circle cx="85"
                cy="145"
                r="25"/>
        <circle cx="140"
                cy="145"
                r="25"/>
        <circle cx="195"
                cy="145"
                r="25"/>
      </g>

      <text x="140"
            y="207"
            font-size="17"
            fill="#61758A">
        local E₂ · V₂
      </text>

    </g>

    <!-- FG3 -->
    <g transform="translate(980 165)">

      <rect width="280"
            height="250"
            rx="22"
            fill="white"
            stroke="#7C3AED"
            stroke-width="4"/>

      <text x="140"
            y="48"
            font-size="27"
            font-weight="700"
            fill="#0B1F33">
        FG3
      </text>

      <text x="140"
            y="82"
            font-size="18"
            fill="#61758A">
        state P₀ · P₁ · P₂
      </text>

      <g fill="#F59E0B">
        <circle cx="85"
                cy="145"
                r="25"/>
        <circle cx="140"
                cy="145"
                r="25"/>
        <circle cx="195"
                cy="145"
                r="25"/>
      </g>

      <text x="140"
            y="207"
            font-size="17"
            fill="#61758A">
        local E₃ · V₃
      </text>

    </g>

  </g>

  <!-- Link labels -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif"
     text-anchor="middle">

    <text x="452"
          y="250"
          font-size="18"
          font-weight="700"
          fill="#0B1F33">
      WKB link 1 ↔ 2
    </text>

    <text x="897"
          y="250"
          font-size="18"
          font-weight="700"
          fill="#0B1F33">
      WKB link 2 ↔ 3
    </text>

  </g>

  <!-- Bidirectional transport arrows -->
  <g fill="none"
     stroke-width="5">

    <!-- FG1 -> FG2 -->
    <path d="M375 300 H525"
          stroke="#1976D2"
          marker-end="url(#arr-right)"/>

    <!-- FG2 -> FG1 -->
    <path d="M525 340 H375"
          stroke="#00897B"
          marker-end="url(#arr-left)"/>

    <!-- FG2 -> FG3 -->
    <path d="M820 300 H970"
          stroke="#1976D2"
          marker-end="url(#arr-right)"/>

    <!-- FG3 -> FG2 -->
    <path d="M970 340 H820"
          stroke="#00897B"
          marker-end="url(#arr-left)"/>

  </g>

  <!-- Conservative transfer block -->
  <rect x="240"
        y="505"
        width="870"
        height="105"
        rx="18"
        fill="#0B1F33"/>

  <text x="675"
        y="547"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="22"
        font-weight="700"
        fill="white">
    Charge-conserving transfer step
  </text>

  <text x="675"
        y="579"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="18"
        fill="#D7E8F5">
    net transfer per FG = incoming flux − outgoing flux
  </text>

  <text x="675"
        y="601"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="15"
        fill="#D7E8F5">
    internal redistribution preserves the total charge of the floating-gate subsystem
  </text>

  <!-- Scope note -->
  <text x="675"
        y="650"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="16"
        fill="#61758A">
    Three-FG example shown; NCMemSim supports configurable one- to three-floating-gate device architectures.
  </text>

</svg>
