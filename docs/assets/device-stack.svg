<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 980"
     role="img"
     aria-labelledby="title desc">

  <title id="title">NCMemSim configurable device stack</title>
  <desc id="desc">
    Generic NCMemSim multilayer nanocrystal floating-gate memory stack with
    configurable control, inter-floating-gate and tunnel dielectrics,
    one to three floating-gate regions, silicon substrate and optional
    optical illumination.
  </desc>

  <defs>
    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#26C6DA"/>
    </marker>

    <filter id="shadow">
      <feDropShadow dx="0"
                    dy="5"
                    stdDeviation="6"
                    flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="1200"
        height="980"
        rx="24"
        fill="#F5F9FC"/>

  <!-- Title -->
  <text x="600"
        y="58"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="34"
        font-weight="750"
        fill="#0B1F33">
    Configurable nanocrystal memory stack
  </text>

  <text x="600"
        y="92"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="18"
        fill="#61758A">
    One to three floating gates with configurable materials, geometry and nanocrystal composition
  </text>

  <!-- Main device stack -->
  <g transform="translate(280 115)"
     font-family="Inter,Segoe UI,Arial,sans-serif"
     text-anchor="middle"
     filter="url(#shadow)">

    <!-- Gate -->
    <rect width="640"
          height="58"
          rx="10"
          fill="#0B1F33"/>

    <text x="320"
          y="37"
          font-size="21"
          font-weight="650"
          fill="white">
      Gate
    </text>

    <!-- Control dielectric -->
    <rect y="72"
          width="640"
          height="68"
          rx="10"
          fill="#A8CCE4"/>

    <text x="320"
          y="103"
          font-size="19"
          font-weight="650"
          fill="#16324F">
      Control dielectric
    </text>

    <text x="320"
          y="126"
          font-size="15"
          fill="#61758A">
      configurable material and thickness
    </text>

    <!-- Floating gate 1 -->
    <rect y="154"
          width="640"
          height="100"
          rx="12"
          fill="white"
          stroke="#1976D2"
          stroke-width="3"/>

    <text x="320"
          y="183"
          font-size="19"
          font-weight="700"
          fill="#0B1F33">
      Floating gate 1
    </text>

    <text x="320"
          y="208"
          font-size="15"
          fill="#61758A">
      Ge / GeSn nanocrystals in dielectric matrix
    </text>

    <g fill="#F59E0B">
      <circle cx="220" cy="231" r="15"/>
      <circle cx="280" cy="231" r="15"/>
      <circle cx="340" cy="231" r="15"/>
      <circle cx="400" cy="231" r="15"/>
    </g>

    <!-- Inter-FG dielectric 1 -->
    <rect y="268"
          width="640"
          height="50"
          rx="9"
          fill="#D5E7F3"/>

    <text x="320"
          y="299"
          font-size="16"
          fill="#16324F">
      Inter-FG dielectric
    </text>

    <!-- Floating gate 2 -->
    <rect y="332"
          width="640"
          height="100"
          rx="12"
          fill="white"
          stroke="#00897B"
          stroke-width="3"/>

    <text x="320"
          y="361"
          font-size="19"
          font-weight="700"
          fill="#0B1F33">
      Floating gate 2
    </text>

    <text x="320"
          y="386"
          font-size="15"
          fill="#61758A">
      independently configurable
    </text>

    <g fill="#F59E0B">
      <circle cx="220" cy="409" r="15"/>
      <circle cx="280" cy="409" r="15"/>
      <circle cx="340" cy="409" r="15"/>
      <circle cx="400" cy="409" r="15"/>
    </g>

    <!-- Inter-FG dielectric 2 -->
    <rect y="446"
          width="640"
          height="50"
          rx="9"
          fill="#D5E7F3"/>

    <text x="320"
          y="477"
          font-size="16"
          fill="#16324F">
      Inter-FG dielectric
    </text>

    <!-- Floating gate 3 -->
    <rect y="510"
          width="640"
          height="100"
          rx="12"
          fill="white"
          stroke="#7C3AED"
          stroke-width="3"/>

    <text x="320"
          y="539"
          font-size="19"
          font-weight="700"
          fill="#0B1F33">
      Floating gate 3
    </text>

    <text x="320"
          y="564"
          font-size="15"
          fill="#61758A">
      optional for multi-FG architectures
    </text>

    <g fill="#F59E0B">
      <circle cx="220" cy="587" r="15"/>
      <circle cx="280" cy="587" r="15"/>
      <circle cx="340" cy="587" r="15"/>
      <circle cx="400" cy="587" r="15"/>
    </g>

    <!-- Tunnel dielectric -->
    <rect y="636"
          width="640"
          height="58"
          rx="10"
          fill="#A8CCE4"/>

    <text x="320"
          y="661"
          font-size="18"
          font-weight="650"
          fill="#16324F">
      Tunnel dielectric
    </text>

    <text x="320"
          y="684"
          font-size="15"
          fill="#61758A">
      configurable material and thickness
    </text>

    <!-- Silicon substrate -->
    <rect y="708"
          width="640"
          height="60"
          rx="10"
          fill="#1976D2"/>

    <text x="320"
          y="746"
          font-size="20"
          font-weight="650"
          fill="white">
      Si substrate
    </text>

  </g>

  <!-- Optional optical illumination -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">

    <text x="1050"
          y="158"
          text-anchor="middle"
          font-size="19"
          font-weight="700"
          fill="#0B1F33">
      Optional illumination
    </text>

    <text x="1050"
          y="184"
          text-anchor="middle"
          font-size="15"
          fill="#61758A">
      λ · power density
    </text>

    <path d="M1050 205
             C1015 255 965 295 905 330"
          fill="none"
          stroke="#26C6DA"
          stroke-width="5"
          marker-end="url(#arrow)"/>

    <text x="1035"
          y="272"
          text-anchor="middle"
          font-size="14"
          fill="#61758A">
      incident source
    </text>

  </g>

  <!-- Per-FG configuration notes -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">

    <text x="95"
          y="265"
          font-size="17"
          font-weight="700"
          fill="#0B1F33">
      Per-FG configuration
    </text>

    <text x="95"
          y="296"
          font-size="15"
          fill="#61758A">
      NC material
    </text>

    <text x="95"
          y="321"
          font-size="15"
          fill="#61758A">
      Sn composition
    </text>

    <text x="95"
          y="346"
          font-size="15"
          fill="#61758A">
      NC diameter
    </text>

    <text x="95"
          y="371"
          font-size="15"
          fill="#61758A">
      volume fraction
    </text>

    <text x="95"
          y="396"
          font-size="15"
          fill="#61758A">
      active fraction
    </text>

    <text x="95"
          y="421"
          font-size="15"
          fill="#61758A">
      occupancy state
    </text>

  </g>

  <!-- Schematic disclaimer -->
  <text x="600"
        y="950"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="16"
        fill="#61758A">
    Schematic only — layer materials and thicknesses depend on the selected device configuration.
  </text>

</svg>
