<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1500 470"
     role="img"
     aria-labelledby="title desc">

  <title id="title">NCMemSim reproducible scientific workflow</title>
  <desc id="desc">
    Scientific workflow from device, material and illumination configuration
    through coupled simulation, validation, reproducibility records and
    publication-ready outputs.
  </desc>

  <defs>
    <marker id="a"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1976D2"/>
    </marker>
  </defs>

  <rect width="1500"
        height="470"
        rx="24"
        fill="#F5F9FC"/>

  <text x="750"
        y="58"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="34"
        font-weight="750"
        fill="#0B1F33">
    Reproducible scientific workflow
  </text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif"
     text-anchor="middle">

    <g transform="translate(55 145)">
      <rect width="230"
            height="135"
            rx="20"
            fill="white"
            stroke="#1976D2"
            stroke-width="3"/>

      <text x="115"
            y="48"
            font-size="23"
            font-weight="700"
            fill="#0B1F33">
        1 · Configure
      </text>

      <text x="115"
            y="82"
            font-size="17"
            fill="#61758A">
        device · materials · source
      </text>

      <text x="115"
            y="108"
            font-size="15"
            fill="#61758A">
        physics · numerical settings
      </text>
    </g>

    <g transform="translate(345 145)">
      <rect width="230"
            height="135"
            rx="20"
            fill="white"
            stroke="#00897B"
            stroke-width="3"/>

      <text x="115"
            y="48"
            font-size="23"
            font-weight="700"
            fill="#0B1F33">
        2 · Simulate
      </text>

      <text x="115"
            y="82"
            font-size="17"
            fill="#61758A">
        electrical · optical
      </text>

      <text x="115"
            y="108"
            font-size="15"
            fill="#61758A">
        coupled · retention · C–V
      </text>
    </g>

    <g transform="translate(635 145)">
      <rect width="230"
            height="135"
            rx="20"
            fill="white"
            stroke="#F59E0B"
            stroke-width="3"/>

      <text x="115"
            y="48"
            font-size="23"
            font-weight="700"
            fill="#0B1F33">
        3 · Validate
      </text>

      <text x="115"
            y="82"
            font-size="17"
            fill="#61758A">
        physics · regression
      </text>

      <text x="115"
            y="108"
            font-size="15"
            fill="#61758A">
        golden · benchmark
      </text>
    </g>

    <g transform="translate(925 145)">
      <rect width="230"
            height="135"
            rx="20"
            fill="white"
            stroke="#7C3AED"
            stroke-width="3"/>

      <text x="115"
            y="48"
            font-size="23"
            font-weight="700"
            fill="#0B1F33">
        4 · Record
      </text>

      <text x="115"
            y="82"
            font-size="17"
            fill="#61758A">
        configuration · version
      </text>

      <text x="115"
            y="108"
            font-size="15"
            fill="#61758A">
        provenance · validation
      </text>
    </g>

    <g transform="translate(1215 145)">
      <rect width="230"
            height="135"
            rx="20"
            fill="white"
            stroke="#1976D2"
            stroke-width="3"/>

      <text x="115"
            y="48"
            font-size="23"
            font-weight="700"
            fill="#0B1F33">
        5 · Publish
      </text>

      <text x="115"
            y="82"
            font-size="17"
            fill="#61758A">
        figures · data
      </text>

      <text x="115"
            y="108"
            font-size="15"
            fill="#61758A">
        metadata · methods
      </text>
    </g>
  </g>

  <g fill="none"
     stroke="#1976D2"
     stroke-width="5"
     marker-end="url(#a)">
    <path d="M285 212 H335"/>
    <path d="M575 212 H625"/>
    <path d="M865 212 H915"/>
    <path d="M1155 212 H1205"/>
  </g>

  <text x="750"
        y="370"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="19"
        fill="#61758A">
    Every reported result should be traceable to its device, physics and illumination configuration,
  </text>

  <text x="750"
        y="401"
        text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="19"
        fill="#61758A">
    software version, parameter provenance and validation record.
  </text>

</svg>
