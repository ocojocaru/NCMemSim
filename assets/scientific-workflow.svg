<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">NCMemSim scientific workflow</title><desc id="desc">Workflow from device configuration through simulation, validation and publication-ready outputs.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1976D2"/></marker></defs><rect width="1500" height="470" rx="24" fill="#F5F9FC"/><text x="750" y="58" text-anchor="middle" font-family="Inter,Arial" font-size="34" font-weight="750" fill="#0B1F33">Reproducible scientific workflow</text>
<g font-family="Inter,Arial" text-anchor="middle"><g transform="translate(55 145)"><rect width="230" height="135" rx="20" fill="white" stroke="#1976D2" stroke-width="3"/><text x="115" y="50" font-size="23" font-weight="700" fill="#0B1F33">1 · Configure</text><text x="115" y="86" font-size="17" fill="#61758A">device + materials</text></g><g transform="translate(345 145)"><rect width="230" height="135" rx="20" fill="white" stroke="#00897B" stroke-width="3"/><text x="115" y="50" font-size="23" font-weight="700" fill="#0B1F33">2 · Simulate</text><text x="115" y="86" font-size="17" fill="#61758A">fields + transport</text></g><g transform="translate(635 145)"><rect width="230" height="135" rx="20" fill="white" stroke="#F59E0B" stroke-width="3"/><text x="115" y="50" font-size="23" font-weight="700" fill="#0B1F33">3 · Validate</text><text x="115" y="86" font-size="17" fill="#61758A">physics + regression</text></g><g transform="translate(925 145)"><rect width="230" height="135" rx="20" fill="white" stroke="#7C3AED" stroke-width="3"/><text x="115" y="50" font-size="23" font-weight="700" fill="#0B1F33">4 · Record</text><text x="115" y="86" font-size="17" fill="#61758A">manifest + hashes</text></g><g transform="translate(1215 145)"><rect width="230" height="135" rx="20" fill="white" stroke="#1976D2" stroke-width="3"/><text x="115" y="50" font-size="23" font-weight="700" fill="#0B1F33">5 · Publish</text><text x="115" y="86" font-size="17" fill="#61758A">figures + data</text></g></g>
<g fill="none" stroke="#1976D2" stroke-width="5" marker-end="url(#a)"><path d="M285 212 H335"/><path d="M575 212 H625"/><path d="M865 212 H915"/><path d="M1155 212 H1205"/></g><text x="750" y="380" text-anchor="middle" font-family="Inter,Arial" font-size="20" fill="#61758A">Every published result should be traceable to a configuration, software version and reproducibility manifest.</text>
